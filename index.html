<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#03018f">
<title>Bakumba Auto Mart | Land Cruisers and 4x4s in Juba</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:wght@400;700&display=swap"><style>
:root{--blue:#03018f;--red:#de131d;--bg:#f3f4f8;--card:#fff;--ink:#0e1020;--mute:#565b70;--line:rgba(14,16,32,.12);--navy:#0b0f3a;--on:#03018f;--wa:#25d366;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0d18;--card:#161a2b;--ink:#f1f2f8;--mute:#a3a8bd;--line:rgba(255,255,255,.14);--on:#7473c1}}
:root[data-theme="dark"]{--bg:#0b0d18;--card:#161a2b;--ink:#f1f2f8;--mute:#a3a8bd;--line:rgba(255,255,255,.14);--on:#7473c1}
html{scroll-behavior:smooth;scroll-padding-top:70px}*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 "DM Sans",system-ui,sans-serif;overflow-x:hidden;padding-bottom:92px}
h1,h2,h3{font-family:"Archivo Black","Arial Black",Impact,sans-serif;font-weight:400;line-height:1.02;margin:0;letter-spacing:-.01em}
a{color:inherit}:focus-visible{outline:3px solid var(--red);outline-offset:3px}
header{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
header div{display:flex;align-items:center;justify-content:space-between;height:60px;padding:0 16px;max-width:1100px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:400 17px "Archivo Black",sans-serif}
.brand img{width:40px;height:40px;border-radius:50%;box-shadow:0 0 0 2px var(--line)}
.pill{padding:9px 16px;border-radius:99px;background:var(--wa);color:#07260f;font-weight:700;font-size:14px;text-decoration:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:52px;padding:0 24px;border-radius:16px;font:700 16px "DM Sans",sans-serif;text-decoration:none;border:0;cursor:pointer;transition:transform .12s,box-shadow .12s}
.btn.wa{background:var(--wa);color:#07260f;box-shadow:0 6px 0 #14803c,0 14px 26px rgba(0,0,0,.28)}
.btn.line{background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6);backdrop-filter:blur(8px)}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #14803c}
.hero{position:relative;min-height:calc(100svh - 60px);display:flex;flex-direction:column;justify-content:flex-end;color:#fff;overflow:hidden;padding:48px 18px 28px;background:var(--navy)}
.hero>img{position:absolute;inset:-6% 0 0;width:100%;height:112%;object-fit:cover;z-index:0}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,15,58,.55),rgba(11,15,58,.2) 30%,rgba(11,15,58,.92) 78%,#0b0f3a)}
.hero>*:not(img){position:relative;z-index:1}
.hero h1{font-size:clamp(40px,11.5vw,84px);max-width:11em}
.hero h1 b{font-weight:400;color:#ff5a52}
.hero p{max-width:34ch;color:#dfe2f5;font-size:18px;margin:16px 0 22px}
.acts{display:grid;gap:12px;max-width:420px}
.stage{perspective:900px;margin-top:30px}
.feat{display:flex;gap:14px;align-items:center;padding:12px;border-radius:22px;background:rgba(255,255,255,.14);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.35);box-shadow:0 30px 50px rgba(0,0,0,.45);transform-style:preserve-3d;transition:transform .15s ease-out;max-width:460px}
.feat img{width:92px;height:92px;object-fit:cover;border-radius:16px;transform:translateZ(40px);box-shadow:0 14px 24px rgba(0,0,0,.4)}
.feat small{display:block;color:#ffb3ae;font-weight:700;font-size:13px}.feat b{display:block;font:400 18px/1.15 "Archivo Black",sans-serif;transform:translateZ(30px)}
.feat span{font-size:13px;color:#dfe2f5}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:18px 16px;max-width:1100px;margin:-22px auto 0;position:relative;z-index:2}
.stats div{background:var(--card);border-radius:18px;padding:14px 8px;text-align:center;box-shadow:0 14px 30px rgba(0,0,0,.14);border-top:4px solid var(--red)}
.stats b{display:block;font:400 clamp(24px,7vw,40px)/1 "Archivo Black",sans-serif;color:var(--on)}.stats span{font-size:12px;color:var(--mute);line-height:1.2;display:block;margin-top:4px}
section{padding:54px 0 10px}.in{max-width:1100px;margin:0 auto;padding:0 18px}
h2{font-size:clamp(32px,8vw,56px)}.sub{color:var(--mute);margin:10px 0 0;max-width:46ch}
.rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:34px calc(50% - 150px) 40px;perspective:1000px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.car{flex:0 0 300px;scroll-snap-align:center;background:var(--card);border-radius:26px;overflow:hidden;box-shadow:0 24px 40px rgba(0,0,0,.22);transform-style:preserve-3d;will-change:transform}
.car img{width:100%;height:230px;object-fit:cover;display:block}
.car div{padding:16px 18px 20px}.car h3{font-size:21px}.car p{color:var(--mute);font-size:14px;margin:6px 0 14px}
.car a{display:flex;justify-content:center;align-items:center;min-height:48px;border-radius:14px;background:var(--blue);color:#fff;font-weight:700;text-decoration:none}
.why{display:grid;gap:14px;margin-top:26px}
.w{display:flex;gap:16px;background:var(--card);border-radius:22px;padding:20px;box-shadow:0 10px 24px rgba(0,0,0,.08)}
.w i{flex:0 0 48px;height:48px;border-radius:14px;background:var(--blue);display:grid;place-items:center;box-shadow:0 8px 0 rgba(0,0,0,.18)}
.w svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.w h3{font-size:19px}.w p{margin:4px 0 0;color:var(--mute);font-size:15px}
.steps{display:grid;gap:0;margin-top:26px;border-left:3px solid var(--red);margin-left:12px}
.steps div{padding:0 0 26px 24px;position:relative}.steps div:before{counter-increment:n;content:counter(n);position:absolute;left:-18px;top:0;width:33px;height:33px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font:400 15px "Archivo Black",sans-serif}
.steps{counter-reset:n}.steps h3{font-size:20px}.steps p{margin:4px 0 0;color:var(--mute)}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:26px}
.gal img{width:100%;height:100%;min-height:160px;object-fit:cover;border-radius:20px;display:block;box-shadow:0 12px 26px rgba(0,0,0,.2)}
.gal img:first-child{grid-column:span 2;height:220px}
.visit{margin:50px 16px 0;border-radius:30px;background:linear-gradient(160deg,var(--blue),var(--navy));color:#fff;padding:32px 22px;box-shadow:0 30px 60px rgba(11,15,58,.4)}
.visit h2{color:#fff}.visit p{color:#d4d8f2}.visit .acts{margin-top:22px}
.visit dl{margin:26px 0 0;display:grid;gap:14px}.visit dt{font-weight:700}.visit dd{margin:2px 0 0;color:#d4d8f2}.visit dd a{display:inline-block;padding:3px 0}
.visit .brand{margin-bottom:18px}
footer{padding:30px 18px 20px;color:var(--mute);font-size:13px;text-align:center}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:1fr 1.5fr;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.bar .btn{min-height:50px;padding:0 10px}.bar .call{background:var(--blue);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.25)}
svg.wi{width:22px;height:22px;fill:currentColor}
@media (min-width:820px){.hero{padding:80px max(24px,calc(50% - 540px)) 60px}.acts{grid-auto-flow:column;max-width:560px}.rail{padding-inline:max(24px,calc(50% - 540px))}.rail .car{flex-basis:320px}.why{grid-template-columns:repeat(3,1fr)}.steps{grid-template-columns:repeat(3,1fr);border-left:0;margin-left:0;border-top:3px solid var(--red);padding-top:22px}.steps div{padding:0 20px 0 0}.steps div:before{left:0;top:-41px}.gal{grid-template-columns:2fr 1fr 1fr}.gal img:first-child{grid-column:auto;grid-row:span 2;height:100%}.visit{max-width:1068px;margin-inline:auto;padding:48px;display:grid;grid-template-columns:1.2fr 1fr;gap:30px}.bar{display:none}body{padding-bottom:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
.mq{overflow:hidden;background:var(--navy);color:#fff;padding:14px 0;margin-top:10px}.mq-in{display:flex;width:max-content}.mq span{display:flex;align-items:center;font:400 18px "Archivo Black",sans-serif;white-space:nowrap}.mq span:after{content:"";width:9px;height:9px;border-radius:50%;background:var(--red);margin:0 26px}
@media (prefers-reduced-motion:no-preference){
@keyframes rise{from{opacity:0;translate:0 36px}to{opacity:1;translate:0 0}}
@keyframes kb{from{scale:1}to{scale:1.14}}
@keyframes fl{50%{translate:0 -9px}}
@keyframes mq{to{translate:-50% 0}}
@keyframes sh{0%,55%{translate:-120% 0}100%{translate:120% 0}}
@keyframes pu{0%{box-shadow:0 0 0 0 rgba(37,211,102,.6)}100%{box-shadow:0 0 0 14px rgba(37,211,102,0)}}
#hi{animation:kb 20s ease-out both}
.hero h1{animation:rise 1s cubic-bezier(.2,.8,.2,1) .1s both}.hero p{animation:rise 1s cubic-bezier(.2,.8,.2,1) .35s both}.hero .acts{animation:rise 1s cubic-bezier(.2,.8,.2,1) .55s both}.hero .stage{animation:rise 1s cubic-bezier(.2,.8,.2,1) .8s both}
.feat{animation:fl 4.5s ease-in-out 2s infinite}
.mq-in{animation:mq 30s linear infinite}
.pill{animation:pu 2.4s infinite}
.btn.wa{position:relative;overflow:hidden}.btn.wa:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.6) 50%,transparent 65%);translate:-120% 0;animation:sh 3.4s infinite}
.rv{opacity:0;translate:0 40px;transition:opacity .8s,translate .8s cubic-bezier(.2,.8,.2,1)}.rv.on{opacity:1;translate:0 0}
.car.rv{opacity:1;translate:150px 0;transition:translate .9s cubic-bezier(.2,.8,.2,1)}.car.rv.on{translate:0 0}
.gal img.rv{opacity:1;translate:none;clip-path:inset(0 0 100% 0 round 20px);transition:clip-path 1.1s cubic-bezier(.2,.8,.2,1)}.gal img.rv.on{clip-path:inset(0 round 20px)}
}
